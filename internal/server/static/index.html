<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>maek / Tunnels</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #e7e9ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .timeline {
      width: 100%;
      max-width: 600px;
      min-height: 100vh;
      border-left: 1px solid #2f3336;
      border-right: 1px solid #2f3336;
      display: flex;
      flex-direction: column;
    }

    /* Top Sticky Navigation */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background-color: rgba(0, 0, 0, 0.65);
      border-bottom: 1px solid #2f3336;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      flex-direction: column;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      color: #e7e9ea;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background: #e7e9ea;
      color: #000000;
      border-radius: 6px;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: -0.5px;
    }

    .header-subtitle {
      font-size: 13px;
      color: #71767b;
      margin-top: 2px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #71767b;
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid #2f3336;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #00ba7c;
    }

    /* Feed Items */
    .feed {
      display: flex;
      flex-direction: column;
    }

    .tweet-card {
      display: flex;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid #2f3336;
      transition: background-color 0.15s ease;
      position: relative;
    }

    .tweet-card:hover {
      background-color: rgba(231, 233, 234, 0.03);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background-color: #1d9bf0;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tweet-content {
      flex: 1;
      min-width: 0;
    }

    .tweet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .tweet-user-info {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .user-name {
      font-weight: 700;
      font-size: 15px;
      color: #e7e9ea;
    }

    .user-handle {
      font-size: 14px;
      color: #71767b;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .dot-separator {
      color: #71767b;
      font-size: 14px;
    }

    .time-ago {
      font-size: 14px;
      color: #71767b;
    }

    .connect-btn {
      background-color: #eff3f4;
      color: #0f1419;
      font-weight: 700;
      font-size: 14px;
      padding: 6px 16px;
      border-radius: 9999px;
      text-decoration: none;
      transition: background-color 0.15s ease;
      white-space: nowrap;
    }

    .connect-btn:hover {
      background-color: #d7dbdc;
    }

    .tweet-desc {
      font-size: 15px;
      line-height: 20px;
      color: #e7e9ea;
      margin-top: 4px;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .media-box {
      margin-top: 12px;
      border-radius: 16px;
      border: 1px solid #2f3336;
      overflow: hidden;
      max-height: 280px;
      background-color: #080808;
    }

    .media-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .tweet-footer {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 12px;
      color: #71767b;
      font-size: 13px;
    }

    .action-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: color 0.15s ease;
      user-select: none;
    }

    .action-item:hover {
      color: #1d9bf0;
    }

    /* Empty state */
    .empty-state {
      padding: 64px 32px;
      text-align: left;
    }

    .empty-title {
      font-size: 31px;
      font-weight: 800;
      color: #e7e9ea;
      line-height: 36px;
      margin-bottom: 8px;
    }

    .empty-subtitle {
      font-size: 15px;
      color: #71767b;
      line-height: 20px;
      margin-bottom: 28px;
    }

    .cli-box {
      background-color: #0a0a0a;
      border: 1px solid #2f3336;
      border-radius: 16px;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      color: #e7e9ea;
      overflow-x: auto;
      line-height: 1.6;
    }

    .cli-prompt {
      color: #71767b;
      user-select: none;
    }

    .cli-cmd {
      color: #1d9bf0;
    }
  </style>
</head>
<body>
  <div class="timeline">
    <header class="header">
      <div class="header-left">
        <div class="header-title">
          <span class="logo-badge">m</span>
          <span>Tunnels</span>
        </div>
        <div class="header-subtitle" id="subtitle-count">Checking for active connections...</div>
      </div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span id="live-label">Live</span>
      </div>
    </header>

    <div id="feed" class="feed">
      <!-- Dynamic list -->
    </div>
  </div>

  <script>
    const AVATAR_COLORS = [
      '#1d9bf0', '#7856ff', '#ff7a00', '#00ba7c', '#f91880', '#00c7e2', '#e0245e'
    ];

    function pickColor(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
    }

    function timeAgo(dateString) {
      const now = new Date();
      const past = new Date(dateString);
      const diffSec = Math.floor((now - past) / 1000);
      if (diffSec < 5) return 'just now';
      if (diffSec < 60) return `${diffSec}s`;
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return `${diffMin}m`;
      const diffHour = Math.floor(diffMin / 60);
      if (diffHour < 24) return `${diffHour}h`;
      return `${Math.floor(diffHour / 24)}d`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    function copyCurl(svcName) {
      const host = window.location.host;
      const cmd = `curl -H "X-Maek-Service: ${svcName}" http://${host}/`;
      navigator.clipboard.writeText(cmd).then(() => {
        alert('Copied curl command to clipboard:\n' + cmd);
      });
    }

    async function fetchServices() {
      try {
        const res = await fetch('/_maek/api/services');
        if (!res.ok) return;
        const services = await res.json();
        renderServices(services);
      } catch (e) {
        console.error('Failed to fetch services:', e);
      }
    }

    function renderServices(services) {
      const feed = document.getElementById('feed');
      const subtitle = document.getElementById('subtitle-count');

      const count = services ? services.length : 0;
      subtitle.textContent = count === 1 ? '1 active tunnel' : `${count} active tunnels`;

      if (!services || services.length === 0) {
        const host = window.location.host;
        feed.innerHTML = `
          <div class="empty-state">
            <div class="empty-title">No active tunnels</div>
            <div class="empty-subtitle">
              Connect a private service from your terminal using <code>maek agent</code>. It will appear here instantly.
            </div>
            <div class="cli-box">
              <span class="cli-prompt">$ </span><span class="cli-cmd">maek agent</span> \\<br>
              &nbsp;&nbsp;--server <span class="cli-cmd">ws://${host}</span> \\<br>
              &nbsp;&nbsp;--name <span class="cli-cmd">my-app</span> \\<br>
              &nbsp;&nbsp;--desc <span class="cli-cmd">"Local development server"</span> \\<br>
              &nbsp;&nbsp;--target <span class="cli-cmd">http://localhost:3000</span>
            </div>
          </div>
        `;
        return;
      }

      feed.innerHTML = services.map(svc => {
        const initial = (svc.name || 'A').charAt(0).toUpperCase();
        const color = pickColor(svc.name || 'A');
        const hasThumb = Boolean(svc.thumbnail && svc.thumbnail.trim());
        const hasDesc = Boolean(svc.description && svc.description.trim());

        const avatarHtml = hasThumb 
          ? `<img src="${escapeHtml(svc.thumbnail)}" alt="${escapeHtml(svc.name)}" onerror="this.parentElement.innerHTML='${initial}'" />`
          : initial;

        const mediaBoxHtml = hasThumb ? `
          <div class="media-box">
            <img src="${escapeHtml(svc.thumbnail)}" alt="Thumbnail" />
          </div>
        ` : '';

        return `
          <div class="tweet-card">
            <div class="avatar" style="background-color: ${color}">
              ${avatarHtml}
            </div>
            <div class="tweet-content">
              <div class="tweet-header">
                <div class="tweet-user-info">
                  <span class="user-name">${escapeHtml(svc.name)}</span>
                  <span class="user-handle">@${escapeHtml(svc.id)}</span>
                  <span class="dot-separator">&middot;</span>
                  <span class="time-ago">${timeAgo(svc.connected_at)}</span>
                </div>
                <a class="connect-btn" href="/_maek/select?id=${encodeURIComponent(svc.id)}">Connect</a>
              </div>

              ${hasDesc ? `<div class="tweet-desc">${escapeHtml(svc.description)}</div>` : ''}
              ${mediaBoxHtml}

              <div class="tweet-footer">
                <span class="action-item" onclick="copyCurl('${escapeHtml(svc.name)}')">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M16 1H4C2.9 1 2 1.9 2 3V17H4V3H16V1ZM19 5H8C6.9 5 6 5.9 6 7V21C6 22.1 6.9 23 8 23H19C20.1 23 21 22.1 21 21V7C21 5.9 20.1 5 19 5ZM19 21H8V7H19V21Z"/>
                  </svg>
                  <span>Copy curl</span>
                </span>
                <span class="action-item">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14h2v2h-2v-2zm0-10h2v8h-2V6z"/>
                  </svg>
                  <span>id: ${escapeHtml(svc.id)}</span>
                </span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Initial load and periodic refresh
    fetchServices();
    setInterval(fetchServices, 2500);
  </script>
</body>
</html>
